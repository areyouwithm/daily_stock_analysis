name: ai_llm_hedge_fund
display_name: AI大模型对冲基金视角
description: 针对AI大模型产业链，以对冲基金基本面研究框架进行深度分析，聚焦A股与港股核心标的
category: framework
core_rules: [3, 5, 6]
required_tools:
  - get_daily_history
  - analyze_trend
  - search_stock_news
  - get_fundamental_data
aliases: [AI大模型, 对冲基金, LLM, 腾讯, 阿里]
default_active: true
default_router: true
